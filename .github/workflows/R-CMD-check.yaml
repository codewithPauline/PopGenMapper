name: R-CMD-check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Build package
        run: R CMD build .
      - name: Check package
        run: R CMD check --no-manual PopGenMapper_*.tar.gz
      - name: Upload check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R-check-report
          path: PopGenMapper.Rcheck/
      - name: Install and render examples
        run: |
          R CMD INSTALL PopGenMapper_*.tar.gz
          Rscript inst/examples/render_demo.R
      - name: Upload example figures
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-example-figures
          path: results/*.svg
