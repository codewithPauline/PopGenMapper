name: R-CMD-check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: R release / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::sf, any::maps
      - name: Build package
        run: R CMD build .
      - name: Check package
        run: R CMD check --no-manual PopGenMapper_*.tar.gz
      - name: Require a clean check report
        if: success()
        shell: Rscript {0}
        run: |
          report <- readLines("PopGenMapper.Rcheck/00check.log", warn = FALSE)
          if (!any(grepl("^Status: OK", report))) {
            stop("R CMD check did not report Status: OK. Inspect the uploaded report.")
          }
      - name: Upload check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R-check-report-${{ matrix.os }}
          path: PopGenMapper.Rcheck/
      - name: Install and verify exports
        run: |
          R CMD INSTALL PopGenMapper_*.tar.gz
          Rscript -e 'library(PopGenMapper); d <- example_ancestry(); stopifnot(nrow(validate_ancestry(d$ancestry, d$coordinates)$ancestry) == 6L); print(packageVersion("PopGenMapper"))'
      - name: Render examples
        if: runner.os == 'Linux'
        run: Rscript inst/examples/render_demo.R
      - name: Upload example figures
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-example-figures
          path: results/
